name: "deps2changesets"
description: "Generate changesets from dependency changes in Dependabot PRs"
author: "IzumiSy"
branding:
  icon: "package"
  color: "blue"

inputs:
  range:
    description: "Git commit range"
    required: false
    default: "origin/main..HEAD"
  release-type:
    description: "Release type for changesets (patch, minor, major)"
    required: false
    default: "patch"
  include-deps:
    description: "Additional dependency types to include (comma-separated: prod, dev, peer, optional)"
    required: false
    default: "prod"
  commit-message:
    description: "Commit message for the changeset"
    required: false
    default: "chore: add changeset for dependency update"
  skip_commit:
    description: "Skip committing the generated changesets"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Fetch base branch
      shell: bash
      run: git fetch origin ${{ github.base_ref }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: "package.json"

    - name: Generate changeset
      shell: bash
      run: npx @izumisy/deps2changesets --range ${{ inputs.range }} --release-type ${{ inputs.release-type }} --include-deps=${{ inputs.include-deps }}

    - name: Commit changeset
      if: inputs.skip_commit != 'true'
      uses: suzuki-shunsuke/commit-action@5eaa5ecce3ffe93d09a85b946dc5136e3713b1b7 # v1.1.0
      with:
        commit_message: ${{ inputs.commit-message }}
        files: ".changeset/*.md"
        fail_on_self_push: false
