name: "deps2changesets"
description: "Generate changesets from dependency changes in dependency update PRs"
author: "IzumiSy"
branding:
  icon: "package"
  color: "blue"

inputs:
  range:
    description: "Git commit range"
    required: false
    default: "origin/main..HEAD"
  release-type:
    description: "Release type for changesets (patch, minor, major)"
    required: false
    default: "patch"
  include-deps:
    description: "Additional dependency types to include (comma-separated: prod, dev, peer, optional)"
    required: false
    default: "prod"
  scope:
    description: "Group generated changesets. Defaults to the current PR number on pull request runs."
    required: false
    default: ""
  commit-message:
    description: "Commit message for the changeset"
    required: false
    default: "chore: add changeset for dependency update"
  skip_commit:
    description: "Skip committing the generated changesets"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Fetch base branch
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
      run: git fetch origin "$BASE_REF"

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: "package.json"

    - name: Generate changeset
      shell: bash
      env:
        RANGE: ${{ inputs.range }}
        RELEASE_TYPE: ${{ inputs.release-type }}
        INCLUDE_DEPS: ${{ inputs.include-deps }}
        SCOPE: ${{ inputs.scope }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [[ -z "$SCOPE" && -n "$PR_NUMBER" ]]; then SCOPE="pr-$PR_NUMBER"; fi
        args=(--range "$RANGE" --release-type "$RELEASE_TYPE" --include-deps "$INCLUDE_DEPS")
        if [[ -n "$SCOPE" ]]; then args+=(--scope "$SCOPE"); fi
        npx @izumisy/deps2changesets "${args[@]}"

    - name: Commit changeset
      if: inputs.skip_commit != 'true'
      uses: suzuki-shunsuke/commit-action@5eaa5ecce3ffe93d09a85b946dc5136e3713b1b7 # v1.1.0
      with:
        commit_message: ${{ inputs.commit-message }}
        fail_on_self_push: false
